<!doctype html><meta charset=utf-8><title>Luminary replay</title>
<style>
:root{--bg:#0b0d10;--fg:#c8d1da;--dim:#6b7785;--acc:#7fdc9c;--warn:#ffb454}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1c232b;--dim:#7b8794;--acc:#187a3f;--warn:#b35c00}}
body{margin:0;background:var(--bg);color:var(--fg);font:13px ui-monospace,Menlo,monospace}
#w{max-width:960px;margin:0 auto;padding:0 16px}canvas{width:100%;height:auto;display:block}
#r{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 16px;margin:8px 0}
#r b{display:block;color:var(--dim);font-weight:normal;font-size:11px}#r span{font-size:16px}
#ds{display:flex;flex-wrap:wrap;gap:4px 20px;margin:8px 0;padding:6px 8px;border:1px solid var(--dim)}
#ds b{color:var(--dim);font-weight:normal;font-size:11px;margin-right:4px}
#md{padding:0 6px}.man{background:var(--warn);color:var(--bg)}
#dl{margin:0 0 24px;border-top:1px solid var(--dim)}
#dl div{padding:2px 0;cursor:pointer;color:var(--dim)}#dl div.cur{color:var(--fg)}
#c{display:flex;gap:8px;align-items:center;margin:8px 0 16px}#c input[type=range]{flex:1}
button,select{background:none;color:var(--fg);border:1px solid var(--dim);font:inherit;padding:2px 8px}
h1{font-size:13px;color:var(--dim);font-weight:normal;margin:12px 0 0}
</style><div id=w><h1>__TITLE__</h1><canvas id=cv width=960 height=420></canvas>
<div id=ds></div><div id=r></div><div id=c><button id=p>pause</button>
<select id=s><option>0.5<option selected>1<option>2<option>5<option>20</select>x
<input id=k type=range min=0 value=0 step=1><span id=tt></span></div>
<div id=dl></div></div>
<script>
const F=__FIELDS__,D=__DATA__,DEC=__DEC__,ALT=__ALT__,HZ=__HZ__,N=D.length;
const cv=document.getElementById('cv'),g=cv.getContext('2d'),css=getComputedStyle(document.body);
const col=n=>css.getPropertyValue(n).trim()||'#888';
const R=[['t','time s',0],['h_m','altitude m',1],['hdot_ms','vert m/s',2],['vh_rel','horiz rel surface m/s',2],
['z_m','cross m',1],['mass_kg','mass kg',0],['thrust_n','thrust N',0],['pitch_deg','pitch deg',1]];
const rd=document.getElementById('r');
R.forEach(([k,l])=>rd.insertAdjacentHTML('beforeend','<div><b>'+l+'</b><span id=v_'+k+'></span></div>'));
const ix=Object.fromEntries(F.map((f,i)=>[f,i]));
const terr=x=>60*Math.sin(x/900)+35*Math.sin(x/230+1)+15*Math.sin(x/61);
let i=0,play=true,last=performance.now(),acc=0;
const k=document.getElementById('k');k.max=N-1;
const dl=document.getElementById('dl'),ds=document.getElementById('ds');
DEC.forEach((e,n)=>{const p=Object.entries(e.params).map(([a,b])=>a+'='+b).join(' ');
 dl.insertAdjacentHTML('beforeend','<div data-n='+n+'>t='+e.t.toFixed(0)+'s  '+e.kind+' '+p+'  -> '+e.applied+'  ('+(e.latency_s*1000).toFixed(0)+' ms)</div>')});
dl.onclick=ev=>{const n=ev.target.dataset&&ev.target.dataset.n;if(n===undefined)return;
 const t0=DEC[+n].t;let j=0;while(j<N-1&&D[j][0]<t0)j++;i=j};
function panel(d){
 let a=null;for(const e of ALT){if(e[0]>d[0])break;a=e}
 const fa=v=>v==null?'--':v.toFixed(0)+' m';
 const dec=DEC.filter(e=>e.t<=d[0]),cur=dec.length-1,al=cur>=0?DEC[cur].alarms:[];
 const f=k=>d[ix[k]]==null?'--':d[ix[k]],man=d[ix.mode]==='manual';
 ds.innerHTML='<span><b>MODE</b><span id=md class="'+(man?'man':'')+'">'+(man?'MANUAL':'AUTO')+'</span></span>'+
  '<span><b>PROG</b>'+f('prog')+'</span><span><b>V</b>'+f('verb')+'</span><span><b>N</b>'+f('noun')+'</span>'+
  '<span><b>R1</b>'+f('r1')+'</span><span><b>R2</b>'+f('r2')+'</span><span><b>R3</b>'+f('r3')+'</span>'+
  '<span><b>RADAR ALT</b>'+(a?fa(a[1]):'--')+'</span><span><b>AGC ALT</b>'+(a?fa(a[2]):'--')+'</span><span><b>ALARMS</b>'+(al.length?al.map(a=>a.toString(8)).join(' '):'none')+'</span>';
 [...dl.children].forEach((c,n)=>c.classList.toggle('cur',n===cur));
}
function draw(){
 const d=D[i],h=d[ix.h_m],x=d[ix.x_m],W=cv.width,H=cv.height;
 g.clearRect(0,0,W,H);
 const span=Math.max(120,h*3),sc=W/span,gy=H*0.82,cyy=y=>gy-y*sc;
 g.strokeStyle=col('--dim');g.lineWidth=1;g.beginPath();
 for(let px=0;px<=W;px+=3){const wx=x+(px-W/2)/sc;const y=gy+(-terr(wx)*0.3)*Math.min(1,sc*4);
  px?g.lineTo(px,y):g.moveTo(px,y)}g.stroke();
 g.fillStyle=col('--dim');g.font='11px monospace';
 const grid=[10,50,100,500,1000,5000,10000].find(s=>s*sc>50)||10000;
 for(let a=grid;a*sc<gy-10;a+=grid){g.fillText(a+' m',4,cyy(a)-2);g.globalAlpha=.2;g.fillRect(0,cyy(a),W,1);g.globalAlpha=1}
 const lx=W/2,ly=cyy(h)-0,pit=d[ix.pitch_deg]*Math.PI/180,th=d[ix.thrust_n];
 g.save();g.translate(lx,ly);g.strokeStyle=col('--fg');g.lineWidth=2;
 g.strokeRect(-8,-16,16,14);g.beginPath();g.moveTo(-14,0);g.lineTo(-8,-4);g.moveTo(14,0);g.lineTo(8,-4);g.stroke();
 if(th>0){g.strokeStyle=col('--warn');g.beginPath();g.moveTo(0,0);
  g.lineTo(-Math.sin(pit)*th/500*-1,Math.cos(pit)*th/500);g.stroke()}g.restore();
 g.strokeStyle=col('--acc');g.beginPath();g.moveTo(lx,ly-8);g.lineTo(lx+d[ix.vh_rel]*sc*4,ly-8-d[ix.hdot_ms]*sc*4);g.stroke();
 panel(d);
 R.forEach(([key,,p])=>document.getElementById('v_'+key).textContent=d[ix[key]].toFixed(p));
 k.value=i;document.getElementById('tt').textContent=d[0].toFixed(0)+' s';
}
function frame(now){const sp=+document.getElementById('s').value;
 if(play){acc+=(now-last)/1000*sp*HZ;const n=Math.floor(acc);acc-=n;i=Math.min(N-1,i+n)}
 last=now;draw();requestAnimationFrame(frame)}
document.getElementById('p').onclick=e=>{play=!play;e.target.textContent=play?'pause':'play'};
k.oninput=()=>{i=+k.value};requestAnimationFrame(frame);
</script>
