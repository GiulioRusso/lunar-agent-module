# Local hooks so the linter/formatter versions are the project's own (uv.lock), not a
# separately pinned pre-commit copy that drifts and reformats differently.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --extra agent python -m mypy
        language: system
        types: [python]
        pass_filenames: false
